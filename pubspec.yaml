name: simpv_system
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^1.2.0

  # HTTP & Internationalization
  http: ^1.2.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # System utilities
  url_launcher: ^6.2.5

  # ⚠️ FIX : file_picker mis à jour pour éviter l’erreur Windows
  file_picker: ^8.0.0

  # PDF
  pdf: ^3.10.4
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/logo/solardesignpro.png
    - assets/offgrid.png
    - assets/ongrid.png
    - assets/hybrid.png
    - assets/direct.png
    - assets/pumping_storage.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
        - asset: assets/fonts/Manrope-Light.ttf
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
        - asset: assets/fonts/Manrope-Bold.ttf
        - asset: assets/fonts/Manrope-ExtraBold.ttf
